<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Corn Cob (Golden Ear) -->
  <linearGradient id="cobGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#FDD835"/>
    <stop offset="50%" stop-color="#FFEB3B"/>
    <stop offset="100%" stop-color="#FBC02D"/>
  </linearGradient>
  <!-- Main Cob Body -->
  <path d="M42 22 C42 16 58 16 58 22 C62 45 62 70 56 86 C53 92 47 92 44 86 C38 70 38 45 42 22 Z" fill="url(#cobGrad)"/>
  <!-- Kernel Texture Rows -->
  <g fill="#F57F17" opacity="0.6">
    <ellipse cx="46" cy="30" rx="2" ry="2.5"/><ellipse cx="50" cy="30" rx="2" ry="2.5"/><ellipse cx="54" cy="30" rx="2" ry="2.5"/>
    <ellipse cx="45" cy="38" rx="2.2" ry="2.5"/><ellipse cx="50" cy="38" rx="2.2" ry="2.5"/><ellipse cx="55" cy="38" rx="2.2" ry="2.5"/>
    <ellipse cx="44" cy="46" rx="2.2" ry="2.5"/><ellipse cx="50" cy="46" rx="2.2" ry="2.5"/><ellipse cx="56" cy="46" rx="2.2" ry="2.5"/>
    <ellipse cx="44" cy="54" rx="2.2" ry="2.5"/><ellipse cx="50" cy="54" rx="2.2" ry="2.5"/><ellipse cx="56" cy="54" rx="2.2" ry="2.5"/>
    <ellipse cx="45" cy="62" rx="2.2" ry="2.5"/><ellipse cx="50" cy="62" rx="2.2" ry="2.5"/><ellipse cx="55" cy="62" rx="2.2" ry="2.5"/>
    <ellipse cx="46" cy="70" rx="2" ry="2.5"/><ellipse cx="50" cy="70" rx="2" ry="2.5"/><ellipse cx="54" cy="70" rx="2.2" ry="2.5"/>
  </g>
  <!-- Silk Tassels at top -->
  <path d="M48 20 Q44 10 38 6" stroke="#8D6E63" stroke-width="1.4" fill="none"/>
  <path d="M50 20 Q50 8 48 4" stroke="#A1887F" stroke-width="1.4" fill="none"/>
  <path d="M52 20 Q56 10 62 6" stroke="#8D6E63" stroke-width="1.4" fill="none"/>
  <!-- Green Husk Leaves (Peeling Back) -->
  <path d="M38 90 C30 75 22 55 24 38 C32 46 40 68 46 88 Z" fill="#689F38"/>
  <path d="M62 90 C70 75 78 55 76 38 C68 46 60 68 54 88 Z" fill="#7CB342"/>
  <!-- Stem -->
  <rect x="47" y="88" width="6" height="8" rx="2" fill="#558B2F"/>
</svg>
