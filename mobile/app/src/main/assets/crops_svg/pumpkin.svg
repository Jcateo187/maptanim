<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pumpkin (Kalabasa / Squash) - Fluted Round Body -->
  <!-- Top Angled Green Stem -->
  <path d="M48 28 C46 18 42 12 40 8 C46 8 52 14 54 28 Z" fill="#2E7D32"/>
  <ellipse cx="48" cy="28" rx="8" ry="3" fill="#1B5E20"/>
  <!-- Segment Ribs (Back to Front) -->
  <!-- Outer Side Ribs -->
  <ellipse cx="28" cy="58" rx="16" ry="26" fill="#EF6C00"/>
  <ellipse cx="72" cy="58" rx="16" ry="26" fill="#E65100"/>
  <!-- Middle Ribs -->
  <ellipse cx="38" cy="60" rx="18" ry="29" fill="#F57C00"/>
  <ellipse cx="62" cy="60" rx="18" ry="29" fill="#EF6C00"/>
  <!-- Center Main Rib -->
  <radialGradient id="pumpGrad" cx="44%" cy="46%" r="55%">
    <stop offset="0%" stop-color="#FFA726"/>
    <stop offset="65%" stop-color="#FB8C00"/>
    <stop offset="100%" stop-color="#E65100"/>
  </radialGradient>
  <ellipse cx="50" cy="62" rx="19" ry="30" fill="url(#pumpGrad)"/>
  <!-- Rib Separation Lines -->
  <path d="M50 32 C42 42 36 60 40 86" stroke="#D84315" stroke-width="1.8" fill="none" opacity="0.6"/>
  <path d="M50 32 C58 42 64 60 60 86" stroke="#BF360C" stroke-width="1.8" fill="none" opacity="0.6"/>
  <!-- Highlight -->
  <ellipse cx="44" cy="48" rx="8" ry="14" fill="#FFE082" opacity="0.35"/>
</svg>
