<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Pipino (Cucumber) - Smooth Emerald Cylindrical Gourd -->
  <!-- Stem at Top Left -->
  <path d="M30 20 C28 14 26 8 20 6 C24 8 28 12 32 18" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Main Cucumber Body (Diagonal Curved Cylinder) -->
  <linearGradient id="cukeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4CAF50"/>
    <stop offset="50%" stop-color="#388E3C"/>
    <stop offset="100%" stop-color="#1B5E20"/>
  </linearGradient>
  <path d="M28 22 C34 16 46 22 54 32 C68 48 82 66 84 76 C86 86 78 92 70 92 C60 92 46 76 34 60 C24 46 22 30 28 22 Z" fill="url(#cukeGrad)"/>
  <!-- Pale Longitudinal Ridges & Speckles -->
  <path d="M34 26 C48 42 66 62 76 84" stroke="#81C784" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3" fill="none" opacity="0.6"/>
  <path d="M40 32 C54 48 70 66 80 80" stroke="#81C784" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 3" fill="none" opacity="0.6"/>
  <!-- Yellow Blossom Node at End Tip -->
  <circle cx="78" cy="88" r="3.5" fill="#FDD835"/>
  <circle cx="78" cy="88" r="1.8" fill="#F57F17"/>
</svg>
