<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- Ampalaya (Bitter Gourd) - Curved Bumpy Pod -->
  <!-- Stem & Vine Curl -->
  <path d="M72 16 C66 12 56 16 52 24 C50 20 44 14 38 18" stroke="#388E3C" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M52 24 C50 26 50 28 50 30" stroke="#2E7D32" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Main Gourd Body -->
  <linearGradient id="ampGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#43A047"/>
    <stop offset="50%" stop-color="#2E7D32"/>
    <stop offset="100%" stop-color="#1B5E20"/>
  </linearGradient>
  <path d="M50 28 C42 32 30 50 34 72 C36 84 46 94 50 96 C54 94 64 84 66 72 C70 50 58 32 50 28 Z" fill="url(#ampGrad)"/>
  <!-- Bumpy / Warty Textures (Signature Ampalaya Ridges) -->
  <g fill="#66BB6A" opacity="0.85">
    <ellipse cx="44" cy="38" rx="3" ry="2"/><ellipse cx="56" cy="38" rx="3" ry="2"/>
    <ellipse cx="40" cy="46" rx="3.5" ry="2.2"/><ellipse cx="50" cy="46" rx="3.5" ry="2.2"/><ellipse cx="60" cy="46" rx="3.5" ry="2.2"/>
    <ellipse cx="38" cy="55" rx="3.8" ry="2.5"/><ellipse cx="50" cy="55" rx="3.8" ry="2.5"/><ellipse cx="62" cy="55" rx="3.8" ry="2.5"/>
    <ellipse cx="40" cy="65" rx="3.5" ry="2.2"/><ellipse cx="50" cy="65" rx="3.5" ry="2.2"/><ellipse cx="60" cy="65" rx="3.5" ry="2.2"/>
    <ellipse cx="42" cy="75" rx="3.2" ry="2"/><ellipse cx="50" cy="75" rx="3.2" ry="2"/><ellipse cx="58" cy="75" rx="3.2" ry="2"/>
    <ellipse cx="46" cy="84" rx="2.5" ry="1.8"/><ellipse cx="54" cy="84" rx="2.5" ry="1.8"/>
  </g>
  <!-- Longitudinal Ridge Lines -->
  <path d="M48 30 Q42 55 48 94" stroke="#81C784" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M52 30 Q58 55 52 94" stroke="#81C784" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
