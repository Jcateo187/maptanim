version: '3.8'

services:
  # MapTanim Admin Dashboard Service
  admin-web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.admin
    container_name: maptanim-admin-web
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT:-8080}:80"
    environment:
      - NODE_ENV=production
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-https://your-supabase-project.supabase.co}
      - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-your-supabase-anon-key}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - maptanim-network

networks:
  maptanim-network:
    driver: bridge
    name: maptanim-network
