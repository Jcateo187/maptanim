Object.entries({tomato:['sol',3,45],eggplant:['sol',4,90],chili:['sol',6,150],okra:['mal',2,90],pechay:['bra',0,0],lettuce:['ast',0,0],kangkong:['con',12,120],cucumber:['cuc',2,30],sitaw:['leg',3,40],corn:['poa',0,0]}).forEach(([k,[f,p,l]])=>Object.assign(C[k],{f,p,l}));

const VAR={
