name: Android CI/CD Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - 'backend/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'

jobs:
  build-and-test:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint Check
        run: ./gradlew lintDebug --continue

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maptanim-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      - name: Upload to Firebase App Distribution
        if: ${{ (secrets.FIREBASE_SERVICE_ACCOUNT_JSON != '' || secrets.FIREBASE_TOKEN != '') && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          groups: testers
          file: mobile/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: "Automated build: ${{ github.event.head_commit.message || 'Manual CI Build' }}"

      - name: Upload Lint Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: mobile/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
